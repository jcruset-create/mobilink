# Pruebas del backend y del panel.
#
# Hasta ahora no había ninguna CI que ejecutara `npm test`: las pruebas solo se
# pasaban a mano. Este workflow ejecuta las unitarias siempre, y además levanta
# un PostgreSQL desechable para las de integración de Mobilink Assist Lite, que
# recorren el ciclo completo contra base de datos real.
#
# La base de datos es un contenedor efímero del runner: no toca nada real y
# muere con el job.
name: Tests

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "src/**"
      - "autoscan_agent/**"
      # El guarda de las de integración vive en scripts/, con sus pruebas: un
      # cambio ahí tiene que pasar por la CI como cualquier otro.
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/tests.yml"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mobilink
          POSTGRES_PASSWORD: mobilink
          POSTGRES_DB: mobilink_test
        ports:
          - 5432:5432
        # Sin esto los tests arrancan antes de que Postgres acepte conexiones
        options: >-
          --health-cmd "pg_isready -U mobilink -d mobilink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # El esquema se crea entero al arrancar (initDb + initConnect), así que
      # la base empieza vacía y no hace falta ningún volcado previo.
      DATABASE_URL: postgresql://mobilink:mobilink@localhost:5432/mobilink_test
      PGSSLMODE: disable
      RUN_DB_TESTS: "1"
      NODE_ENV: test
      # server/supabase.ts se valida al importarse, y mountConnect lo arrastra
      # por la cadena backoffice → rbac → core/auth. Los valores son ficticios
      # a propósito: la API de la APK se autentica con su propio token y las
      # pruebas no suben ficheros, así que nunca se llama a Supabase. Si algún
      # día una prueba lo llamara, fallaría de forma evidente en vez de tocar
      # un proyecto real.
      SUPABASE_URL: http://supabase.invalid
      SUPABASE_SERVICE_ROLE_KEY: clave-ficticia-de-pruebas
      SUPABASE_ROADSIDE_BUCKET: roadside

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - name: Typecheck del panel
        run: npx tsc -b

      # El backend se ejecuta con `tsx`, que borra los tipos sin comprobarlos:
      # sin esto, un error de tipos en server/ llega a producción.
      - name: Typecheck del servidor (Central Pro y Lite)
        run: npx tsc -p tsconfig.server.json

      # El agente de AutoScan tiene su propio tsconfig y NO entra en el `tsc -b`
      # de arriba. Sin esta línea, sus errores de tipos solo aparecerían el día
      # de compilar el instalador, que es el peor momento para descubrirlos.
      - name: Typecheck del agente de AutoScan
        run: npx tsc -p autoscan_agent/tsconfig.json --noEmit

      # Los typechecks de arriba NO compilan el bundle, y Render sí: la entrega
      # #55 pasó la CI en verde y su deploy murió compilando, dejando en
      # producción el código de la anterior sin que nadie se enterara. Compilar
      # aquí lo mismo que compila Render cierra ese agujero.
      - name: Compilar el bundle (lo mismo que hace Render)
        run: npx vite build

      # Una sola pasada: el informe JSON sirve para los dos pasos siguientes.
      #
      # La salida se guarda ADEMÁS en un fichero, y no es un capricho: el
      # informe JSON de vitest NO guarda el motivo cuando lo que revienta es un
      # `beforeAll` —el fichero sale «failed», sus casos «skipped» y sin
      # mensaje—, y ése es justo el fallo que más cuesta diagnosticar. El motivo
      # solo aparece en la salida de texto, bajo «Failed Suites».
      #
      # `pipefail` para que el estado del job siga siendo el de `npm test` y no
      # el de `tee`, que siempre sale en verde.
      - name: Pruebas (unitarias + integración contra PostgreSQL)
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=verbose --reporter=json --outputFile.json=/tmp/tests.json \
            2>&1 | tee /tmp/tests.txt

      # ── Qué ha fallado, en un sitio donde se pueda leer ──────────────────
      #
      # Un rojo de esta CI era desproporcionadamente difícil de leer: el log del
      # job se descarga de un almacén aparte que las redes restringidas no
      # alcanzan, y la COLA que devuelve la API es el log del contenedor de
      # PostgreSQL, que se concatena al final y tapa el resumen de vitest. Lo
      # que se leía eran cien líneas de «duplicate key value violates…» de
      # pruebas que esperaban fallar, y ni rastro del fallo de verdad.
      #
      # Las anotaciones se leen por api.github.com, sin pasar por ese almacén.
      # Por eso el resumen sale como anotación y no solo como artefacto.
      #
      # `if: always()` porque esto solo sirve cuando algo ha ido mal, que es
      # cuando el paso anterior ha cortado el job.
      - name: Qué ha fallado (anotaciones + resumen)
        if: always()
        run: node scripts/ci-resumen-pruebas.mjs /tmp/tests.json /tmp/tests.txt

      # El informe y la salida completos, para quien pueda bajárselos: las
      # anotaciones llevan la cabeza del error, no la pila entera.
      - name: Guardar el resultado de las pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-pruebas
          path: |
            /tmp/tests.json
            /tmp/tests.txt
          retention-days: 14
          if-no-files-found: warn

      # Si las de integración se saltaran por un fallo de configuración, el job
      # seguiría verde y no nos enteraríamos: eso es peor que no tenerlas.
      #
      # La comprobación vive en un script con sus propias pruebas, y no aquí
      # embebida, porque embebida no se podía ejecutar en local: cuando
      # `seguridadHttp.integration.test.ts` pasó a gobernarse con su propia
      # variable `RUN_HTTP_TESTS`, este paso empezó a fallar con razón y la CI se
      # quedó SEIS commits en rojo sin que se viera, porque `npm test` en local
      # pasaba. Ver scripts/ci-integracion-ejecutada.mjs y su .test.ts.
      - name: Comprobar que las de integración se han ejecutado de verdad
        if: always()
        run: node scripts/ci-integracion-ejecutada.mjs /tmp/tests.json
