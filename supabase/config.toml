
[functions.admin-create-user]
enabled = true
# verify_jwt sigue en false porque la propia función valida la sesión y
# comprueba el rol con service role. Pasarlo a true es de la Fase 3; anotado
# para que no se lea como un olvido.
verify_jwt = false
import_map = "./functions/admin-create-user/deno.json"
# Uncomment to specify a custom file path to the entrypoint.
# Supported file extensions are: .ts, .js, .mjs, .jsx, .tsx
entrypoint = "./functions/admin-create-user/index.ts"
# Specifies static files to be bundled with the function. Supports glob patterns.
# For example, if you want to serve static HTML pages in your function:
# static_files = [ "./functions/admin-create-user/*.html" ]

[functions.admin-update-user]
enabled = true
verify_jwt = false
import_map = "./functions/admin-update-user/deno.json"
entrypoint = "./functions/admin-update-user/index.ts"

[functions.alertas-email]
enabled = true
# No lleva sesión de usuario: la dispara un trabajo programado y se autentica
# con el secreto `ALERTAS_CRON_SECRET` que comprueba la propia función. Sin ese
# secreto configurado, la función responde 503 y no hace nada.
verify_jwt = false
import_map = "./functions/deno.json"
entrypoint = "./functions/alertas-email/index.ts"
