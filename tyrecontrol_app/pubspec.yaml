name: tyrecontrol_app
description: "Mobilink TyreControl — revision de neumaticos en campo"
publish_to: 'none'

# UNA sola numeración para Android y para iOS: la de aquí.
#
# Antes iOS iba por su cuenta —«1.0» escrito a mano en codemagic.yaml— y la APK
# por el pubspec (0.46.x). Con dos numeraciones no se puede saber, al dar
# soporte, cuál de las dos apps es más nueva: la tablet decía 0.46.5+261 y el
# iPhone 1.0.0+158 con el mismo código dentro.
#
# Se arranca en 1.1.0 y no en 0.46.6 porque en TestFlight ya hay una 1.0, y
# Apple no admite que el nombre de versión vaya hacia atrás. Android no tiene
# tienda —la APK se instala a mano— así que subir de 0.46 a 1.1 no le afecta:
# lo único que Android exige es que el número de build crezca, y ese lo pone el
# contador de la CI.
version: 1.1.0+261

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.8.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.0

  url_launcher: ^6.3.0

  image_picker: ^1.1.2
  # Escanear el QR de la etiqueta del neumático al montar. Misma versión que
  # en toolcontrol_app, que ya lo usa: una sola versión que mantener.
  mobile_scanner: ^5.2.3
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.0

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Sonda Bluetooth Transense TLGX (profundidad, presión, RFID)
  flutter_blue_plus: ^1.32.12
  permission_handler: ^11.3.1
  device_info_plus: ^11.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

# Icono de la app (SEA TyreControl). Genera todos los tamaños de Android a
# partir del logo. Ejecutar: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  # Apple no admite canal alfa en el icono de 1024: se quita el canal (las
  # esquinas transparentes del logo quedan negras, como su fondo).
  remove_alpha_ios: true
  image_path: "assets/icono_app.png"
  min_sdk_android: 21
  # Negro del propio logo; el primer plano lleva margen de seguridad para que
  # el recorte del icono adaptativo no corte el logotipo (y la tarjeta casi
  # negra se funde con este fondo).
  adaptive_icon_background: "#0A0C0F"
  adaptive_icon_foreground: "assets/icono_app_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo_transparent.png
    - assets/icono_app.png
    # logo_login.png ya no se empaqueta: el login usa el logo horizontal.
    - assets/logo_cabecera.png
