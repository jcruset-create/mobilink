services:
  - type: web
    name: sea-tarragona
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeploy: true
    branch: main
    envVars:
      - key: NODE_ENV
        value: production
      - key: AGENDA_TIME_ZONE
        value: Europe/Madrid
      # Dominio publico de cara al cliente. Se configura en el panel de Render
      # junto con el custom domain (ver docs/render-deploy.md).
      - key: PUBLIC_APP_URL
        sync: false
      - key: CANONICAL_PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: avatars
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPERVISOR_PASSWORD
        sync: false
      - key: SCREENS_PASSWORD
        sync: false
      - key: TV75_PASSWORD
        sync: false
      - key: BACKUP_PASSWORD
        sync: false
      - key: ROADSIDE_OPERATOR_CODE
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: OPENAI_DEFAULT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_DOCUMENT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_REPORT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_ASSISTANT_MODEL
        value: gpt-5.6-luna
      - key: OPENAI_FALLBACK_MODEL
        value: gpt-5-mini
      - key: OPENAI_API_KEY
        sync: false
      # Geocodificacion (busqueda de ubicacion del mapa) y ETAs por carretera
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: TWILIO_WHATSAPP_NUMBER
        sync: false
      - key: TWILIO_CONTENT_SID
        sync: false
      - key: TWILIO_ROADSIDE_CONTENT_SID
        sync: false
      - key: TWILIO_JOB_FINISHED_CONTENT_SID
        sync: false
      # Bucket de evidencias (fotos y firmas de asistencias, tambien las de Lite)
      - key: SUPABASE_ROADSIDE_BUCKET
        value: roadside
      # Notificaciones push de las APKs (FCM v1). El JSON de la cuenta de
      # servicio se pega en el dashboard, nunca en el repositorio.
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Integration Hub — Business Central (valores en el dashboard, nunca en el repo)
      - key: IH_SECRET__BUSINESS_CENTRAL__AAD_TENANT_ID
        sync: false
      - key: IH_SECRET__BUSINESS_CENTRAL__CLIENT_ID
        sync: false
      - key: IH_SECRET__BUSINESS_CENTRAL__CLIENT_SECRET
        sync: false
