workflows:
  ios-testflight:
    name: Mobilink Assist · iOS → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        # El App ID «com.mobilink.assist» está dado de alta en Apple Developer y
        # la app existe en App Store Connect asociada a él. Este identificador es
        # el definitivo; el anterior («com.seatarragona.operario») no se usa ni
        # se recupera.
        #
        # Tiene que decir EXACTAMENTE lo mismo que
        # ios/Runner.xcodeproj/project.pbxproj. Si los dos no coinciden, la
        # firma falla al buscar el perfil.
        #
        # Requiere la integración de App Store Connect en Codemagic:
        # Teams → Integrations → App Store Connect.
        distribution_type: app_store
        bundle_identifier: com.mobilink.assist
      vars:
        # OPCIONAL, y este workflow NO lo usa: la publicación va con
        # «auth: integration», que localiza la app por su bundle id. Se deja
        # porque es el dato que pide cualquier script de App Store Connect que
        # se quiera añadir después. No es un bloqueo para la primera build.
        APP_STORE_APPLE_ID: "PENDIENTE"
        # ── La versión de iOS va aparte de la de Android, y hay motivo ─────
        #
        # «pubspec.yaml» dice 1.10.4+66 y esa numeración es la de la APK, que
        # lleva 66 entregas a las tablets. Bajarla a 1.0.0 para estrenar en la
        # App Store convertiría la siguiente APK en una actualización «hacia
        # atrás» y Android no la instalaría encima.
        #
        # Así que el nombre de versión de iOS se pone aquí y el número de build
        # lo pone Codemagic, que es monótono por definición. Para la segunda
        # entrega, se sube este número y ya está.
        IOS_VERSION: "1.0.0"
      groups:
        - appstore_connect            # grupo con las credenciales App Store Connect (UI de Codemagic)
    working_directory: flutter_app
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Instalar pods
        script: |
          cd ios && pod install
      - name: Build IPA
        script: |
          # La versión y el build se pasan a Flutter, no con agvtool: «flutter
          # build» reescribe Generated.xcconfig con FLUTTER_BUILD_NAME y
          # FLUTTER_BUILD_NUMBER, que es de donde el Info.plist saca los dos
          # valores. Lo que hiciera agvtool antes se perdía en ese paso.
          flutter build ipa --release \
            --build-name="$IOS_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - flutter_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Grupos de testers internos que reciben la build automáticamente.
        #
        # ESTE GRUPO TIENE QUE EXISTIR YA en App Store Connect (TestFlight →
        # Internal Testing) y llamarse exactamente así. Si no existe, la build
        # se sube bien y la publicación falla al final, que es la peor forma de
        # enterarse: cuarenta minutos de compilación tirados.
        beta_groups:
          - SEA Tecnicos
      email:
        recipients:
          - jcruset@gmail.com
        notify:
          success: true
          failure: true
