# El heap de Gradle. Mismo número que Assist, y por el mismo motivo.
#
# A Assist le subió de 2G a 6G porque la compilación de release murió con
# «Java heap space» dentro de JetifyTransform, al transformar el .jar del
# engine de Flutter — y no por un cambio de código: el mismo commit, relanzado
# sin tocar nada, compiló a la segunda. Con 2G el build entra y sale del
# límite según cómo venga de cargado el runner.
#
# Lite es más pequeña y todavía no ha fallado, pero tenía exactamente la
# misma configuración, así que tenía el mismo agujero esperando. Se iguala en
# vez de buscarle un número propio: -Xmx es un máximo, no una reserva, así que
# una app pequeña no gasta más por tenerlo alto, y un solo número para todas
# ahorra la pregunta de por qué ésta es distinta.
#
# El metaspace en 1G: ahí solo van metadatos de clases.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true
android.enableJetifier=true
