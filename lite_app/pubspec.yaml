name: lite_app
description: "Mobilink Assist Lite — asistencias de Central Pro para talleres colaboradores"
publish_to: "none"
version: 0.3.0+61

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  http_parser: ^4.0.2
  shared_preferences: ^2.2.2
  geolocator: ^13.0.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  # La cámara del sistema solo hace la foto en nombre de la app si esta tiene
  # el permiso concedido, y image_picker no lo pide: ver services/camara.dart
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.0
  signature: ^5.5.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.0.5
  # Avisos push de Central Pro. El backend ya enviaba (FCM v1); esto es el lado
  # que recibe. Sin google-services.json la app arranca igual y se queda con el
  # sondeo de la bandeja: ver lib/services/push.dart.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
