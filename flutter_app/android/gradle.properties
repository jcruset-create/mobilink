# El heap de Gradle, y por qué no son 2G.
#
# Con 2G la compilación de release murió con «Java heap space» dentro de
# JetifyTransform, justo al transformar el .jar de arm64_v8a del engine de
# Flutter. No fue por un cambio de código: el mismo commit compiló a la
# segunda sin tocar nada. Es decir, con 2G el build entra y sale del límite
# según cómo venga de cargado el runner, y falla de vez en cuando sin motivo
# aparente — que es peor que fallar siempre, porque cada rojo hay que ir a
# leerlo para descubrir que no era nada.
#
# 6G porque ésta es la app más grande de las cuatro y el runner de la CI tiene
# 16 GB: deja sitio de sobra para el demonio de Kotlin y para el propio runner.
# TyreControl lleva 8G desde hace tiempo y compila sin incidencias, así que el
# margen está donde debe estar; aquí se queda algo por debajo porque no hace
# falta tanto y porque -Xmx es un máximo que también se pide en los portátiles.
#
# El metaspace baja de los 4G de TyreControl a 1G a propósito: ahí sólo van
# metadatos de clases y 4G no es un margen, es no haber mirado el número.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m
android.useAndroidX=true

# El jetifier: apagado, y comprobado antes de apagarlo.
#
# Traducía a AndroidX las bibliotecas que aún usaban la vieja support library
# de Android, deprecada desde 2018. Es una transformación cara —es donde Assist
# se quedó sin memoria, ver #262— y ya no la necesita nadie aquí.
#
# «Ya no la necesita nadie» no es una impresión: lo dijo `checkJetifier`, la
# tarea que AGP trae para esto, ejecutada en la CI sobre las tres apps. Recorre
# el grafo de dependencias módulo a módulo y nombraría a las que la necesitan.
# No nombró a ninguna; de todas dijo «does not use any legacy support
# libraries» y AGP recomendó explícitamente ponerlo en false.
#
# Importaba comprobarlo en vez de suponerlo: si alguna lo hubiera necesitado,
# el fallo no habría sido un error de compilación sino una clase que no aparece
# en tiempo de ejecución, o sea un cierre inesperado en el terminal del
# operario. Para volver a preguntarlo cuando se añadan dependencias:
#
#   flutter build apk --release --config-only
#   cd android && ./gradlew checkJetifier -Pandroid.enableJetifier=true
android.enableJetifier=false
