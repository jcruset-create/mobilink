name: taller_app
description: "WorkPlanner Taller — tareas del técnico en la tablet del taller"
publish_to: "none"
version: 1.0.4+294

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  http_parser: ^4.0.2
  # local_auth pide el Face ID / huella al sistema; flutter_secure_storage
  # guarda el PIN en el llavero, no en preferencias. Como en Assist lite.
  local_auth: ^3.0.1
  flutter_secure_storage: ^10.3.1
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^3.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    # Logotipo de la cabecera. Va con transparencia y el texto en blanco: está
    # hecho para el fondo oscuro de la app, no sirve sobre claro.
    - assets/logo-workplanner.png
